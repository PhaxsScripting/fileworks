[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fileworks-local"
version = "0.1.0"
description = "Local, explicit CSV audits and cleanup with no silent value conversion"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
fileworks = "fileworks.__main__:main"

[tool.setuptools]
packages = ["fileworks"]
